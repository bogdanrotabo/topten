# Deploy the badge-preview Worker when it changes.
#
# The Worker lives in worker/ and runs on Cloudflare in front of GitHub Pages,
# on /badge only. Without this, deploying it means a terminal and a browser
# login; with it, a push that touches worker/ is the deploy.
#
# It needs one secret, CLOUDFLARE_API_TOKEN. Without one the job says so and
# skips, finishing green: no token is the normal state of this workflow until
# somebody sets one up, and a red X for a state nobody chose is a false alarm
# that teaches people to ignore the real ones. Once the token exists, a
# failure is a genuine failure and stays red. To create it:
#
#   1. https://dash.cloudflare.com/profile/api-tokens -> Create Token
#   2. Use the "Edit Cloudflare Workers" template
#   3. Account Resources: the account topten.one is on
#      Zone Resources: Include -> Specific zone -> topten.one
#   4. Copy the token once -- it is shown one time
#   5. https://github.com/bogdanrotabo/topten/settings/secrets/actions
#      -> New repository secret -> name CLOUDFLARE_API_TOKEN, paste, save
#
# That token can edit Workers on this account and nothing else. To take it
# away, delete it on the same page it was made on; the Worker already deployed
# keeps running.
#
# To stop deploying: disable this workflow in the Actions tab, or delete this
# file. To take the Worker off the site entirely:
#   npx wrangler delete --name topten-badge
# and the site goes back to serving GitHub Pages directly on /badge.

name: Deploy badge Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Said plainly, before wrangler says it obscurely -- and said on the run
      # page itself, not only buried in a log nobody opens. A missing secret
      # reads as "not configured yet", which is what it is.
      - name: Is the token there?
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have=no" >> "$GITHUB_OUTPUT"
          {
            echo "### The Worker was not deployed"
            echo
            echo "There is no \`CLOUDFLARE_API_TOKEN\` secret on this repository."
            echo "That is the normal state until somebody creates one, so this run"
            echo "is green rather than red."
            echo
            echo "**Nothing is broken.** \`/badge\` keeps being served by GitHub"
            echo "Pages exactly as it is today; the Worker has simply never been"
            echo "deployed."
            echo
            echo "The comment at the top of \`.github/workflows/deploy-worker.yml\`"
            echo "says how to add the token."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.have == 'yes'
        with:
          node-version: '22'

      - name: Deploy
        if: steps.token.outputs.have == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
