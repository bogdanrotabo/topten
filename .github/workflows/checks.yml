# What a contributor would run before pushing, run for them.
#
# There was nothing on pull requests until this file: the only two workflows
# fire on a push to main or on a cron, so a branch could be opened, reviewed
# and merged without a single thing having been executed. "No checks" and "all
# checks passed" look identical in the merge box, and that is the worse of the
# two to be wrong about.
#
# Every step here is a command that already existed and that anybody can run
# locally, which is the point: this workflow adds no rule of its own, it just
# refuses to let one be broken quietly.
#
# What it deliberately does NOT do is run scripts/prerender.mjs for real. That
# reads the live database, and the king changes whenever somebody pays, so a
# check that compared its output against the committed page would fail on a
# payment rather than on a mistake. Its --check mode, which only asks whether
# the markers are still in the page, is what runs instead.
#
# There is no database and no Stripe key here, and nothing in this file needs
# one: the migration and the two Edge Functions are checked as text, not run.
#
# To stop it: disable the workflow in the Actions tab, or delete this file.

name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch. A second push while the first is still going cancels
  # it -- the answer for the older commit is not one anybody will read.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: The site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything the browser loads has to parse the way a browser parses it.
      # `node --check` is not that check: it reads a file as a script, and the
      # three files below are modules. A syntax error in app.js once passed
      # --check and broke the whole result page silently, which is why
      # check.mjs imports them instead.
      # The build reads the live rankings, so running it here proves both that
      # it works and that the database is answering. It is also the only way
      # scripts/build.mjs gets parsed: importing it to check the syntax would
      # run it, and a checker with side effects is one nobody trusts.
      - name: The site builds from the live rankings
        run: node scripts/build.mjs

      - name: The site's own checks
        run: node scripts/check.mjs

      - name: The shell scripts parse
        run: bash -n scripts/stripe-setup.sh supabase/tests/run.sh

  money:
    name: The money, on a real Postgres
    runs-on: ubuntu-latest
    # The economic rules are the one thing here that must not be taken on
    # trust: what a payment adds, what a duplicate webhook does not add, that a
    # tie loses, that an expired listing keeps its total, and that nobody
    # holding the publishable key can reach a secret or a cent. All of it runs
    # against a real PostgreSQL rather than being read and believed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: The economic path holds
        env:
          PGPASSWORD: postgres
          PSQL: psql -h 127.0.0.1 -p 5432 -U postgres
        run: bash supabase/tests/ci.sh

  functions:
    name: The Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deno, not Node: these files run on Deno and use Deno's own globals.
      # Type-checking them with anything else would either fail on Deno.serve
      # or need a stub, and a stub is a second thing to keep true.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: They typecheck
        run: |
          deno check supabase/functions/stripe-webhook/index.ts
          deno check supabase/functions/growth/index.ts

      - name: They lint
        run: deno lint supabase/functions/
