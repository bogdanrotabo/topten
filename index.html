<body>

<!-- Instagram's mark is a gradient, not a flat colour. Defining it once here
     keeps every inlined copy of the icon referencing one definition. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="tt-ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd521"/>
      <stop offset=".26" stop-color="#f50000"/>
      <stop offset=".62" stop-color="#b900b4"/>
      <stop offset="1" stop-color="#4400c8"/>
    </linearGradient>
  </defs>
</svg>

<header class="masthead">
  <div class="shell masthead__row">
    <a class="wordmark" href="/" data-link>TopTen<b>.one</b></a>
    <span class="stat--live" id="mast-live" hidden><span class="pulse"></span><span id="mast-live-n">0</span></span>
  </div>
</header>

<main id="view" aria-live="polite">
  <div class="shell board">
    <div class="rows">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <div class="sponsor">
      <span class="sponsor__k">Official sponsor</span>
      <img class="sponsor__logo" src="/icons/rotabo.png" width="26" height="26" alt="" loading="lazy"><a class="sponsor__brand" href="https://rotabo.app" target="_blank" rel="noopener">Rotabo<b>.app</b></a>
      <span class="sponsor__tag">Need me? Find me!</span>
    </div>
    <nav>
      <a href="/about.html">About</a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
      <a href="#" id="foot-contact">Contact</a>
    </nav>
    <p>🇨🇭 Made in Switzerland · Available worldwide</p>
    <p style="font-size:11px;max-width:56ch;margin:8px auto 0">
      Not affiliated with X, Instagram, TikTok, YouTube, Facebook, Telegram, Snapchat, Twitch,
  LinkedIn or Threads.
      Rank is decided by money paid. All payments are final.
    </p>
  </div>
</footer>

<div class="sticky" id="sticky" hidden>
  <div class="sticky__inner">
    <button class="btn" id="cta-claim">Claim a spot</button>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__panel" id="modal-panel"></div>
</div>

<canvas id="confetti" hidden></canvas>

<script src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
